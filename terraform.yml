name: terraform-pr-lane

# The PR lane: every pull request gets fmt + validate + plan.
# Plan output is posted to the PR — reviewers never run terraform locally.
# This is the "paved road" pattern: propose → CI plans → review → merge applies.

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write   # OIDC — no long-lived AWS keys in this repo
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # which environment stacks did the PR touch? plan only those
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | cut -d/ -f2 | sort -u | grep -E '^(dev|stage|prod)$' | tr '\n' ' ')
          echo "envs=${CHANGED:-dev}" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(format('["{0}"]', join(fromJSON(format('[{0}]', needs.detect.outputs.envs)), '","'))) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Assume role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.env)] }}
          aws-region: eu-west-1

      - name: Terraform fmt + init + validate + plan
        working-directory: environments/${{ matrix.env }}
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate
          terraform plan -input=false -lock=false

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### Terraform plan — ${{ matrix.env }}\n' +
              'Ran in CI; reviewers: read this, not your local terminal.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
